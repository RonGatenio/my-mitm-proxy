# Sample mymitm.toml — fill in real IPs and cert/key paths before use.
# This file contains NO secrets; cert_path/key_path point to placeholder paths.

# The single target client IP (e.g. the VPN client we are intercepting).
target_client_ip = "10.8.0.5"

# The real server IP:port we proxy to.
target_server_ip = "192.168.1.50"
# target_server_port = 443  # default

# The box IP on the egress interface (used for SNAT source-IP preservation).
box_ip = "192.168.1.10"

# Paths to the REAL leaf certificate and private key (PEM).
# Generate a throwaway pair for testing:
#   openssl req -x509 -newkey ed25519 -keyout k.pem -out c.pem -days 1 -nodes -subj /CN=test
cert_path = "/etc/mymitm/leaf.pem"
key_path  = "/etc/mymitm/leaf.key"

# Network interfaces
tun_iface    = "tun0"    # TUN device (client-side)
egress_iface = "eth0"    # Egress NIC (server-side)

# Local listener the eBPF DNAT redirects client traffic to.
local_addr = "127.0.0.1"
local_port = 8443

# SO_MARK value set on upstream sockets to bypass eBPF re-interception.
fwmark = 0x1337

# Where decrypted payload dumps are written (JSONL index + .c2s/.s2c blobs).
dump_path = "/var/tmp/mitm-dumps"

# Logging. stdout and the log file each have their own level and BOTH default to
# "off" (the proxy is silent unless asked to log). RUST_LOG/tracing syntax:
# off|error|warn|info|debug|trace, or targeted e.g. "mymitm=debug".
# CLI equivalents: --stdout-log-level / --file-log-level / --log-file.
# stdout_log_level = "off"
# file_log_level   = "off"
# log_file         = "/var/tmp/mymitm.log"   # used only when file_log_level != off

# Preserve the client's source IP on the upstream leg (the proxy dials the real
# server as if it were the client). Default true. Set false — or pass
# --preserve-src-ip=false — to dial with the box's own IP instead (standard proxy
# behavior); the server then sees box_ip, not the client. Useful as a negative
# control to confirm preservation is what changes the source IP.
# preserve_src_ip = true

# Manage the kernel sysctls the eBPF data plane needs (default true). When true,
# mymitm sets net.ipv4.conf.<tun_iface>.route_localnet=1 (only if local_addr is a
# loopback address) and net.ipv4.conf.{all,<tun_iface>}.rp_filter=0 when they would
# otherwise silently drop the diverted client traffic, and restores them on exit.
# Set false — or pass --manage-sysctls=false — to leave sysctls untouched; the proxy
# then FAILS FAST at startup with the exact commands to run if they are misconfigured.
# eBPF data plane only (the iproute plane always manages these itself).
# manage_sysctls = true

# Run the data plane inside a network namespace (default true).
#
# Interception turns ONE forwarded flow into TWO locally-terminated ones: the
# client's SYN is rewritten to local_addr:local_port and delivered via INPUT, and
# the proxy dials the server itself so that leg leaves via OUTPUT. A box whose
# firewall only permits "FORWARD -> server" drops both, in EITHER data plane.
# In namespace mode both legs are FORWARDed through a veth pair instead, so a box
# that already permits the forward needs no firewall change at all. mymitm builds
# the namespace, the two veth pairs and the policy routes itself, runs the data
# plane inside as a supervised child, and reverses all of it on exit.
#
# Requires (a startup preflight checks these and fails fast otherwise):
#   - net.ipv4.ip_forward=1 on the host,
#   - the forward permission for the server NOT pinned to -i/-o interfaces
#     (a rule like "-i tun0 -o eth0 -d <server> -j ACCEPT" cannot match the
#     namespace's veths; make it destination-only, or set netns = false).
#     Under ufw: "ufw route allow to <server> port <port> proto tcp" is fine,
#     "ufw route allow in on tun0 out on eth0 ..." is not.
#   - preserve_src_ip left true IF that permission is scoped to a source subnet
#     ("ufw route allow from <vpn_subnet> to <server> ..."), since the upstream
#     leg only carries a source in that subnet while preservation is on.
#
# The steer into the namespace is narrowed to TCP target_server_port, so other
# traffic to the same address (e.g. an RD Gateway's UDP 3391 transport) keeps
# being forwarded normally instead of dying inside the namespace. That narrowing
# needs kernel >= 4.17. mymitm does not probe for that (it adds nothing to your box
# just to test it): it attempts the scoped rule and, if the kernel rejects it, falls
# back to steering everything to the server and WARNs about what that costs.
#
# Set false — or pass --netns=false — to run directly on tun_iface/egress_iface.
# You then have to permit the two locally-terminated legs yourself.
# netns = true

# Decode intercepted WebSocket traffic (in addition to the raw byte dump).
# Default true. Set false — or pass --ws-decode=false — to skip decoding.
# ws_decode = true

# Optional: SNI hostname to send in the upstream TLS ClientHello.
# If unset, the server IP string is used (works if the server accepts IP SNI).
# server_name = "real.example.com"
