[package]
name = "mymitm"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
mymitm-common = { path = "../mymitm-common", features = ["user"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
