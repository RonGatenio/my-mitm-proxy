name: CI

# Build + test on every push (to any branch except `release`, which is handled
# by release.yml) and on PRs. This is the pipeline that must be green on the
# default branch: it compiles the eBPF object, runs the unit tests, builds the
# static musl release, and asserts the binary has zero shared-object deps.
on:
  push:
    branches:
      - '**'
      - '!release'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # System deps mirror .gitlab-ci.yml (eBPF toolchain + musl).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            libclang-dev \
            libelf-dev \
            linux-libc-dev \
            lld \
            llvm \
            llvm-dev \
            musl-tools \
            pkg-config \
            zlib1g-dev

      # rust-toolchain.toml pins nightly + rust-src + the musl target; install
      # explicitly to be safe.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target x86_64-unknown-linux-musl
          rustup target add x86_64-unknown-linux-musl --toolchain nightly
          rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install bpf-linker
        run: test -x "$HOME/.cargo/bin/bpf-linker" || cargo install bpf-linker --locked

      - name: Versions
        run: |
          rustc --version
          cargo --version
          bpf-linker --version

      - name: Test
        run: |
          cargo test -p mymitm-common --target x86_64-unknown-linux-gnu
          cargo test -p mymitm --target x86_64-unknown-linux-gnu

      - name: Build release (static musl)
        run: cargo build -p mymitm --release

      # The whole point of the musl build: a single self-contained binary. Fail
      # the pipeline if the linker ever pulled in a shared-object dependency.
      - name: Verify fully static (no shared-object deps)
        run: |
          f=target/x86_64-unknown-linux-musl/release/mymitm
          file "$f"
          ldd "$f" 2>&1 || true
          if readelf -d "$f" 2>/dev/null | grep -q 'NEEDED'; then
            echo "ERROR: binary has dynamic NEEDED dependencies — not fully static"
            readelf -d "$f" | grep 'NEEDED'
            exit 1
          fi
          echo "OK: statically linked, no NEEDED entries"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymitm-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/mymitm
