name: CI & Release

# Build + test on every push/PR; on a v* tag, also publish a GitHub Release
# with the static musl binary attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # required for creating the Release on tag pushes

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System deps mirror .gitlab-ci.yml (eBPF toolchain + musl).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            libclang-dev \
            libelf-dev \
            linux-libc-dev \
            lld \
            llvm \
            llvm-dev \
            musl-tools \
            pkg-config \
            zlib1g-dev

      # rust-toolchain.toml pins nightly + rust-src + the musl target;
      # rustup honours it automatically. Install explicitly to be safe.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target x86_64-unknown-linux-musl
          rustup target add x86_64-unknown-linux-musl --toolchain nightly
          rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install bpf-linker
        run: test -x "$HOME/.cargo/bin/bpf-linker" || cargo install bpf-linker --locked

      - name: Versions
        run: |
          rustc --version
          cargo --version
          bpf-linker --version

      - name: Test
        run: |
          cargo test -p mymitm-common --target x86_64-unknown-linux-gnu
          cargo test -p mymitm --target x86_64-unknown-linux-gnu

      - name: Build release (static musl)
        run: cargo build -p mymitm --release

      - name: Stage release asset
        run: |
          install -D -m 0755 \
            target/x86_64-unknown-linux-musl/release/mymitm \
            dist/mymitm-x86_64-unknown-linux-musl
          sha256sum dist/mymitm-x86_64-unknown-linux-musl > dist/mymitm-x86_64-unknown-linux-musl.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymitm-x86_64-unknown-linux-musl
          path: dist/*

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
